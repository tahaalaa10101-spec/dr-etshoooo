version: "3.8"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dr_etshoooo_2026}
      POSTGRES_DB: ${POSTGRES_DB:-dr_etshoooo}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-dr_etshoooo_2026}@db:5432/${POSTGRES_DB:-dr_etshoooo}?schema=public
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-this-in-production-2026}
      NODE_ENV: production
    depends_on:
      - db

volumes:
  postgres_data:
